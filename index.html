<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SWF Shopping Platform</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #f5f5f5;
            color: #333;
        }
        header {
            background: #fff;
            padding: 10px 15px;
            border-bottom: 1px solid #ddd;
            text-align: center;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 15px;
        }
        .section-title {
            font-size: 20px;
            margin: 20px 0 10px;
            font-weight: bold;
        }
        /* Product Grid */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 15px;
        }
        .product-card {
            background: #fff;
            border-radius: 8px;
            padding: 10px;
            position: relative;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .badge {
            position: absolute;
            top: 15px;
            left: 15px;
            background: #ff3838;
            color: #fff;
            padding: 3px 8px;
            font-size: 11px;
            border-radius: 12px;
            font-weight: bold;
        }
        .product-img {
            width: 100%;
            height: 140px;
            object-fit: cover;
            border-radius: 6px;
        }
        .product-title {
            font-size: 14px;
            margin: 8px 0 4px;
            font-weight: bold;
        }
        .price-box {
            margin: 5px 0;
        }
        .price {
            color: #5c32e0;
            font-weight: bold;
            font-size: 16px;
        }
        .old-price {
            text-decoration: line-through;
            color: #888;
            font-size: 12px;
            margin-left: 5px;
        }
        .btn {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-cart {
            background: #eef2ff;
            color: #5c32e0;
            border: 1px solid #5c32e0;
        }
        .btn-buy {
            background: #5c32e0;
            color: #fff;
        }

        /* Footer Section */
        footer {
            background: #fff;
            padding: 20px 15px;
            margin-top: 30px;
            border-top: 1px solid #ddd;
        }
        .footer-links ul {
            list-style: none;
        }
        .footer-links li {
            margin-bottom: 8px;
        }
        .footer-links a {
            text-decoration: none;
            color: #555;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <header>
        <h2>SWF Shopping Platform</h2>
    </header>

    <div class="container">
        <!-- Top Selling Products -->
        <div class="section-title">Top Selling Products</div>
        <div class="product-grid" id="top-selling"></div>

        <!-- New Arrivals -->
        <div class="section-title">New Arrivals</div>
        <div class="product-grid" id="new-arrivals"></div>

        <!-- Just For You -->
        <div class="section-title">Just For You</div>
        <div class="product-grid" id="just-for-you"></div>
    </div>

    <!-- Footer -->
    <footer>
        <div class="container">
            <h3>SWF</h3>
            <p>Hotline: 01962598673</p>
            <div class="footer-links">
                <br>
                <ul>
                    <li><a href="#">Terms and condition</a></li>
                    <li><a href="#">FAQ</a></li>
                    <li><a href="#">Privacy Policy</a></li>
                    <li><a href="#">Contact</a></li>
                    <li><a href="#">Track order</a></li>
                </ul>
            </div>
        </div>
    </footer>

    <script>
        // Sample Product Data
        const products = [
            { id: 1, name: "Power Bank", price: "৳2,300", oldPrice: "৳2,500", tag: "Best Selling", type: "top" },
            { id: 2, name: "Watch for Men", price: "৳600", oldPrice: "৳800", tag: "Save ৳200", type: "new" },
            { id: 3, name: "Waterproof Watch", price: "৳800", oldPrice: "৳900", tag: "Save ৳100", type: "new" },
            { id: 4, name: "জার্জেট শাড়ি", price: "৳850", oldPrice: "৳1,000", tag: "Save ৳150", type: "you" }
        ];

        function renderProducts() {
            products.forEach(p => {
                const card = `
                    <div class="product-card">
                        <span class="badge">${p.tag}</span>
                        <div style="height:120px; background:#eee; border-radius:6px; margin-bottom:8px;"></div>
                        <div class="product-title">${p.name}</div>
                        <div class="price-box">
                            <span class="price">${p.price}</span>
                            <span class="old-price">${p.oldPrice}</span>
                        </div>
                        <button class="btn btn-cart">Add to cart</button>
                        <button class="btn btn-buy">Buy now</button>
                    </div>
                `;
                if(p.type === 'top') document.getElementById('top-selling').innerHTML += card;
                if(p.type === 'new') document.getElementById('new-arrivals').innerHTML += card;
                if(p.type === 'you') document.getElementById('just-for-you').innerHTML += card;
            });
        }

        renderProducts();
    </script>
</body>
</html>
